<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem;
            color: #111;
        }

        header h1 {
            margin-bottom: 0.5rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: inherit;
        }

        nav a:hover {
            text-decoration: underline;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin: 1.5rem 0 2rem 0;
            border: 2px solid #222;
        }

        caption {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: left;
            margin-bottom: 0.75rem;
        }

        th, td {
            border: 2px solid #222;
            padding: 0.85rem 1.25rem;
            text-align: center;
        }

        thead th {
            font-weight: 600;
        }

        tbody th[scope="row"] {
            font-weight: normal;
        }

        .highlight-row td {
            background-color: #f2f2f4;
        }

        footer {
            margin-top: 1.5rem;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>Acme Plans</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <table>
            <caption>Plan comparison</caption>
            <thead>
                <tr>
                    <th scope="col">Plan</th>
                    <th scope="col">Storage</th>
                    <th scope="col">Projects</th>
                    <th scope="col">Support</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Free</th>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>
                <tr>
                    <th scope="row">Pro</th>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>
                <tr>
                    <th scope="row">Business</th>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
                <tr class="highlight-row">
                    <td colspan="4">All plans include SSL and daily backups</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2025 MySite</p>
    </footer>
</body>
</html>
